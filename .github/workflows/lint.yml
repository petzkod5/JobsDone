name: Lint
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned automation check tools
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/automation-tools"
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          case "$(uname -m)" in
            arm64)
              ACTION_ARCH=arm64
              SHELL_ARCH=aarch64
              ACTION_SHA=aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f
              SHELL_SHA=339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f
              ;;
            x86_64)
              ACTION_ARCH=amd64
              SHELL_ARCH=x86_64
              ACTION_SHA=5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644
              SHELL_SHA=c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51
              ;;
            *) echo 'Unsupported macOS architecture' >&2; exit 1 ;;
          esac
          curl --fail --location --silent --show-error "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_$ACTION_ARCH.tar.gz" -o actionlint.tar.gz
          curl --fail --location --silent --show-error "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.$SHELL_ARCH.tar.gz" -o shellcheck.tar.gz
          printf '%s  %s\n' "$ACTION_SHA" actionlint.tar.gz | shasum -a 256 --check --status
          printf '%s  %s\n' "$SHELL_SHA" shellcheck.tar.gz | shasum -a 256 --check --status
          tar -xzf actionlint.tar.gz actionlint
          tar -xzf shellcheck.tar.gz --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$TOOLS" >> "$GITHUB_PATH"
      - name: Check shell scripts and workflows
        run: ./scripts/check.sh
      - name: Install pinned SwiftLint
        run: ./scripts/setup-lint.sh
      - name: Lint all Swift code
        run: python3 scripts/lint.py
      - name: Test automation and lint failure detection
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
