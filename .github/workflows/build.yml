name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test monitor state
        run: ./scripts/test.sh
      - name: Build app
        run: ./scripts/build.sh
